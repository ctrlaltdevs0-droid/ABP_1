<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ÁgilCert - Login</title>

    <link rel="stylesheet" href="./assets/css/typography.css">
    <link rel="stylesheet" href="./assets/css/index.css">
</head>

<body>

    <main class="auth-page">

        <a href="index.html" class="auth-logo">
            <img src="./assets/img/logo.png"
                 alt="ÁgilCert"
                 class="logo">
        </a>

        <section class="auth-content">

            <!-- IMAGEM -->
            <div class="auth-image-area">

                <img
                    src="./assets/img/ilustracao.png"
                    alt="Pessoa estudando"
                    class="auth-image">

            </div>


            <!-- FORMULÁRIO -->
            <div class="auth-form-area">

                <form
                    class="auth-form"
                    id="loginForm">

                    <h1 class="auth-title">
                        Bem vindo!
                    </h1>

                    <p class="auth-subtitle">
                        Faça login para continuar
                    </p>


                    <div class="form-group">

                        <label for="email">
                            E-mail:
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="senha">
                            Senha:
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn-primary auth-button">

                        Entrar

                    </button>


                    <p class="auth-footer">

                        Não tem uma conta?

                        <a href="cadastro.html">
                            Cadastre - se
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <script src="./login.html"></script>

</body>

</html>
