<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ÁgilCert - Cadastro</title>

    <link rel="stylesheet" href="./assets/css/typography.css">
    <link rel="stylesheet" href="./assets/css/index.css">

</head>

<body>

    <main class="auth-page">

        <a href="index.html" class="auth-logo">

            <img
                src="./assets/img/logo.png"
                alt="ÁgilCert"
                class="logo">

        </a>


        <section class="auth-content">

            <!-- ILUSTRAÇÃO -->

            <div class="auth-image-area">

                <img
                    src="./assets/img/ilustracao.png"
                    alt="Pessoa estudando"
                    class="auth-image">

            </div>


            <!-- FORMULÁRIO -->

            <div class="auth-form-area">

                <form
                    class="auth-form register-form"
                    id="registerForm">

                    <h1 class="auth-title">
                        Criar conta
                    </h1>

                    <p class="auth-subtitle">
                        Preencha os dados para cadastrar
                    </p>


                    <div class="form-group">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Seu nome completo"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="cadastroEmail">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="cadastroEmail"
                            placeholder="seu@email.com"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="cadastroSenha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="cadastroSenha"
                            placeholder="Digite sua senha"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="confirmarSenha">
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Confirme sua senha"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn-primary auth-button">

                        Criar conta

                    </button>


                    <p class="auth-footer">

                        Já tem uma conta?

                        <a href="login.html">
                            Entrar
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <script src="js/index.js"></script>

</body>

</html>
