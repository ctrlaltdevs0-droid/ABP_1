<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÁgilCert | Cadastro</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-visual" aria-label="Apresentação ÁgilCert">
      <img class="brand" src="assets/img/logo-agilcert.png" alt="ÁgilCert">
      <div class="visual-copy">
        <h3>Comece sua jornada.</h3>
        <p>Crie sua conta para acessar conteúdos, questões e acompanhar sua evolução.</p>
      </div>
      <img class="hero-character" src="assets/img/personagem-login.png" alt="Ilustração de estudante programando">
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <h4>Crie sua conta</h4>
        <p>Preencha os dados abaixo para começar.</p>

        <div class="feedback" role="alert"></div>

        <form data-auth-form="cadastro">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome completo" required>
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <div class="password-wrap">
              <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="6" placeholder="Crie uma senha" required>
              <button class="toggle-password" type="button" onclick="togglePassword('senha', this)">Mostrar</button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmacao">Confirmar senha</label>
            <div class="password-wrap">
              <input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" minlength="6" placeholder="Repita sua senha" required>
              <button class="toggle-password" type="button" onclick="togglePassword('confirmacao', this)">Mostrar</button>
            </div>
          </div>

          <button class="btn btn-primary" type="submit">CRIAR CONTA</button>
        </form>

        <p class="auth-footer">Já possui uma conta? <a href="login.html">Entrar</a></p>
      </div>
    </section>
  </main>
  <script src="assets/js/auth.js"></script>
</body>
</html>
