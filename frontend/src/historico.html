<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÁgilCert | Histórico</title>

  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/estudos.css">
  <link rel="stylesheet" href="assets/css/historico.css">

  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/historico.js"></script>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <a href="home.html" class="logo-link">
      <img class="header-logo" src="assets/img/logo-transparente.png" alt="ÁgilCert">
    </a>

    <button class="nav-toggle" type="button" aria-controls="main-nav" aria-expanded="false">
      Menu
    </button>

    <nav id="main-nav" class="header-nav" aria-label="Navegação principal">
      <a class="nav-link" href="home.html">Início</a>
      <a class="nav-link" href="estudos.html">Estudos</a>
      <a class="nav-link" href="certificacao.html">Certificação</a>
      <a class="nav-link active" href="historico.html" aria-current="page">Histórico</a>
      <a class="nav-link" href="home.html#sobre-nos">Sobre nós</a>
    </nav>

    <div class="header-actions header-actions-custom">

      <!-- USUÁRIO DESLOGADO -->
      <div id="authButtons" class="auth-buttons-custom">
        <a href="login.html" class="nav-link">Entrar</a>
        <a href="cadastro.html" class="nav-link">Cadastrar</a>
      </div>

      <!-- MENU DO PERFIL -->
      <div class="profile-menu" id="profileMenu" style="display: none;">

        <button
          class="profile-trigger"
          type="button"
          id="profileTrigger"
          aria-expanded="false"
          aria-controls="userProfileMenu"
          aria-label="Menu do perfil">

          <div class="profile-avatar profile-avatar-img">
            <span id="userInitials" class="account-initials-span">—</span>

            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path
                d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" />
            </svg>

          </div>

          <span class="profile-name">
            Olá, <span id="userName">Usuário</span>
          </span>

          <span class="chevron">▼</span>

        </button>

        <div class="dropdown" id="userProfileMenu">

          <div class="dropdown-header">
            <div class="profile-username" id="dropdownUserName">
              Usuário
            </div>

            <div class="profile-greeting">
              Minha conta
            </div>
          </div>

          <div class="dropdown-body">

            <a href="perfil.html">Meu Perfil</a>

            <a href="historico.html">Histórico</a>

            <div class="divider"></div>

            <button class="danger" type="button" id="sair">
              Sair
            </button>

          </div>

        </div>

      </div>

    </div>

  </header>


  <!-- CONTEÚDO PRINCIPAL -->
  <main class="study-main">

    <p class="eyebrow">SUAS CERTIFICAÇÕES</p>

    <h1>Histórico de provas</h1>

    <p id="mensagem" role="status" aria-live="polite">
      Carregando histórico…
    </p>

    <!-- LISTA DAS TENTATIVAS -->
    <div class="tabela-historico">

      <table id="lista" hidden>

        <thead>
          <tr>
            <th>Data</th>
            <th>Acertos</th>
            <th>Percentual</th>
            <th>Situação</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="tentativas"></tbody>

      </table>

    </div>

    <!-- DETALHE DE UMA TENTATIVA -->
    <section id="detalhe" hidden aria-labelledby="titulo-detalhe">

      <h2 id="titulo-detalhe">Questões da prova</h2>

      <ol id="questoes" class="questoes-historico"></ol>

    </section>

    <noscript>
      Ative o JavaScript para ver o seu histórico.
    </noscript>

  </main>


  <!-- JAVASCRIPT DO HEADER -->
  <script>

    // =====================================================
    // MENU RESPONSIVO
    // =====================================================

    const navToggle = document.querySelector('.nav-toggle');
    const mainNav = document.getElementById('main-nav');

    navToggle.addEventListener('click', () => {

      const expanded = navToggle.getAttribute('aria-expanded') === 'true';

      navToggle.setAttribute('aria-expanded', String(!expanded));
      mainNav.classList.toggle('is-open', !expanded);

    });

    document.querySelectorAll('#main-nav a').forEach(link => {

      link.addEventListener('click', () => {

        navToggle.setAttribute('aria-expanded', 'false');
        mainNav.classList.remove('is-open');

      });

    });


    // =====================================================
    // MENU DO PERFIL
    // =====================================================

    const profileMenu = document.getElementById('profileMenu');
    const profileTrigger = document.getElementById('profileTrigger');

    profileTrigger.addEventListener('click', function (event) {

      event.stopPropagation();

      profileMenu.classList.toggle('open');

      const aberto = profileMenu.classList.contains('open');

      profileTrigger.setAttribute('aria-expanded', String(aberto));

    });

    document.addEventListener('click', function (event) {

      if (!profileMenu.contains(event.target)) {

        profileMenu.classList.remove('open');
        profileTrigger.setAttribute('aria-expanded', 'false');

      }

    });


    // =====================================================
    // PERSISTÊNCIA DO USUÁRIO
    // =====================================================

    document.addEventListener('DOMContentLoaded', async function () {

      const token = localStorage.getItem('token');
      const usuarioSalvo = localStorage.getItem('usuario');

      const authButtons = document.getElementById('authButtons');
      const userNameSpan = document.getElementById('userName');
      const dropdownUserName = document.getElementById('dropdownUserName');
      const userInitials = document.getElementById('userInitials');

      // Exibe os dados do usuário logado
      function exibirLogado(usuario) {

        if (!usuario) return;

        const nomeCompleto = usuario.nome || usuario.name || 'Usuário';
        const partes = nomeCompleto.trim().split(/\s+/);

        const primeiroNome = partes[0];

        userNameSpan.textContent = primeiroNome;
        dropdownUserName.textContent = nomeCompleto;

        const iniciais = partes[0][0] +
          (partes.length > 1
            ? partes[partes.length - 1][0]
            : partes[0].slice(1, 2));

        userInitials.textContent = iniciais.toUpperCase();

        authButtons.style.display = 'none';
        profileMenu.style.display = 'flex';

      }

      // Exibe os botões de login e cadastro
      function exibirDeslogado() {

        profileMenu.style.display = 'none';
        authButtons.style.display = 'flex';

      }

      // Recupera os dados salvos no navegador
      if (token && usuarioSalvo) {

        try {

          const usuario = JSON.parse(usuarioSalvo);

          exibirLogado(usuario.usuario || usuario);

        } catch (error) {

          console.error('Erro ao carregar usuário:', error);

          exibirDeslogado();

        }

      } else if (!token) {

        exibirDeslogado();

        return;

      }

      // Atualiza os dados pela API
      if (token && typeof AgilCertAPI !== 'undefined') {

        try {

          const resposta = await AgilCertAPI.request('usuarios/me');

          const usuarioAtualizado = resposta.usuario || resposta;

          if (usuarioAtualizado && usuarioAtualizado.nome) {

            localStorage.setItem(
              'usuario',
              JSON.stringify(usuarioAtualizado)
            );

            exibirLogado(usuarioAtualizado);

          }

        } catch (error) {

          console.warn('API indisponível, usando dados salvos:', error);

          if (!usuarioSalvo) {
            exibirDeslogado();
          }

        }

      }

    });


    // =====================================================
    // SAIR DA CONTA
    // =====================================================

    async function logout() {

      const button = document.getElementById('sair');
      const mensagem = document.getElementById('mensagem');

      button.disabled = true;

      try {

        await AgilCertAPI.logout();

      } catch (error) {

        mensagem.textContent = error.message;

        button.disabled = false;

      }

    }

    document.getElementById('sair').addEventListener('click', logout);

  </script>

</body>

</html>
