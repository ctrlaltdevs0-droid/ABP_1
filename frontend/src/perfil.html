<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha conta | ÁgilCert</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: #fff;
      color: #687586;
      font-family: Arial, Helvetica, sans-serif
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent
    }

    button {
      font: inherit;
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid #00a8b6;
      outline-offset: 5px
    }

    .page {
      max-width: 1028px;
      margin: 30px auto 0
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 39px;
      border-bottom: 1px solid #d5d5d5;
      margin-bottom: 14px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 29px;
      font-weight: 700;
      color: #4b5964;
      white-space: nowrap
    }

    .brand svg {
      width: 40px;
      height: 40px
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-weight: 700;
      font-size: 20px
    }

    .nav a:hover {
      color: #0755a1
    }

    .account {
      display: flex;
      gap: 32px;
      align-items: center;
      color: #52606a
    }

    .account-icon {
      display: grid;
      place-items: center;
      background: #e1e1e1;
      border-radius: 50%;
      width: 40px;
      height: 40px
    }

    .account svg {
      width: 30px;
      height: 30px
    }

    .account-links {
      display: grid;
      gap: 8px;
      font-size: 13px
    }

    .account-links button {
      border: 0;
      padding: 0;
      background: none;
      color: inherit;
      text-align: left
    }

    .content {
      background: #f6f6f6;
      padding: 17px 8px 20px
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 322px 1fr;
      gap: 12px
    }

    .panel {
      background: white;
      border-radius: 17px;
      box-shadow: 0 5px 7px #0003, 0 0 5px #00000008
    }

    .profile {
      padding: 20px 29px 54px;
      text-align: center
    }

    .portrait {
      width: 212px;
      height: 212px;
      margin: 0 auto;
      border: 10px solid #dadada;
      border-radius: 50%;
      overflow: hidden;
      background: #e8eeeb
    }

    .portrait svg {
      display: block;
      width: 100%;
      height: 100%
    }

    .profile h1 {
      margin: 20px -10px 34px;
      color: #54616b;
      font-size: 40px;
      line-height: 1.15;
      font-weight: 400
    }

    .primary {
      width: 100%;
      min-height: 55px;
      padding: 12px 14px;
      border: 0;
      border-radius: 9px;
      background: #0753a0;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 4px 6px #0004
    }

    .primary:hover {
      background: #064485
    }

    .details {
      padding: 21px 16px 48px 14px
    }

    .details h2,
    .journey h2 {
      margin: 0;
      font-size: 21px;
      line-height: 26px
    }

    .fields {
      display: grid;
      gap: 20px;
      margin: 27px 0 0
    }

    .field {
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 65px;
      padding: 8px 24px;
      border-radius: 18px;
      box-shadow: 0 5px 6px #0004, 0 0 5px #00000008
    }

    .icon {
      width: 27px;
      height: 27px;
      flex-shrink: 0;
      color: #536169
    }

    .field dt {
      font-size: 21px;
      font-weight: 700;
      line-height: 27px
    }

    .field dd {
      font-size: 21px;
      line-height: 27px;
      margin: 0;
      overflow-wrap: anywhere
    }

    .journey {
      margin-top: 37px;
      min-height: 222px;
      padding: 17px 16px 40px
    }

    .journey h2 {
      margin-left: 14px
    }

    .progress-wrap {
      margin-top: 54px
    }

    .track {
      height: 30px;
      background: #d9d9d9;
      border-radius: 30px;
      box-shadow: 0 4px 6px #0004;
      overflow: hidden
    }

    .fill {
      height: 100%;
      width: 60%;
      background: #77c8ae;
      border-radius: 30px;
      position: relative;
      border: 1px solid #ffffff80
    }

    .fill:before,
    .fill:after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #ffffff70
    }

    .fill:before {
      left: 21.5%
    }

    .fill:after {
      left: 85%
    }

    .milestones {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 48px 0;
      font-weight: 700;
      font-size: 20px
    }

    .milestones span {
      text-align: center
    }

    dialog {
      border: 0;
      border-radius: 16px;
      padding: 30px;
      max-width: 440px;
      color: #536169;
      box-shadow: 0 10px 50px #0004
    }

    dialog::backdrop {
      background: #172b4566
    }

    dialog h2 {
      margin-top: 0
    }

    dialog button {
      margin-top: 12px
    }

    footer {
      font-size: 12px;
      text-align: center;
      padding: 12px;
      color: #687586
    }

    @media(max-width:1050px) {
      .page {
        margin: 20px 20px 0
      }

      .nav {
        gap: 16px;
        font-size: 16px
      }

      .topbar {
        gap: 15px
      }

      .account {
        gap: 12px
      }

      .profile-grid {
        grid-template-columns: 30% 1fr
      }

      .profile {
        padding: 22px 20px 40px
      }

      .portrait {
        width: min(100%, 212px);
        height: auto;
        aspect-ratio: 1
      }

      .profile h1 {
        font-size: 32px
      }

      .milestones {
        padding-inline: 20px
      }
    }

    @media(max-width:760px) {
      .page {
        margin: 16px 12px 0
      }

      .topbar {
        flex-wrap: wrap;
        padding-bottom: 12px
      }

      .brand {
        font-size: 27px
      }

      .nav {
        order: 3;
        width: 100%;
        overflow: auto;
        gap: 22px;
        padding: 10px 0 2px;
        font-size: 14px;
        white-space: nowrap
      }

      .account {
        margin-left: auto
      }

      .profile-grid {
        grid-template-columns: 1fr;
        gap: 20px
      }

      .profile {
        padding: 24px
      }

      .profile h1 {
        margin: 18px 0 24px
      }

      .primary {
        max-width: 300px
      }

      .details {
        padding: 24px 16px 30px
      }

      .fields {
        margin-top: 24px
      }

      .field {
        gap: 18px;
        padding-inline: 18px
      }

      .field dt,
      .field dd {
        font-size: 18px
      }

      .journey {
        margin-top: 24px;
        padding: 22px 16px 30px;
        min-height: 200px
      }

      .journey h2 {
        margin-left: 0
      }

      .progress-wrap {
        margin-top: 36px
      }

      .milestones {
        font-size: 13px;
        padding: 12px 0 0;
        gap: 8px
      }

      .milestones span {
        flex: 1
      }

      .track {
        height: 24px
      }
    }

    input {
      display: block;
      width: 100%;
      min-width: 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px;
      font: inherit;
      color: inherit
    }

    .field>div {
      min-width: 0;
      flex: 1
    }

    button:disabled {
      opacity: .6;
      cursor: wait
    }
  </style>
</head>

<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <symbol id="user" viewBox="0 0 24 24">
        <circle cx="12" cy="7" r="4" />
        <path d="M3 22v-3c0-5 18-5 18 0v3Z" />
      </symbol>
      <symbol id="email" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="1" />
        <path d="m3 6 9 7 9-7" />
      </symbol>
      <symbol id="list" viewBox="0 0 24 24">
        <path d="M9 6h12M9 12h12M9 18h12" />
        <circle cx="4" cy="6" r=".5" />
        <circle cx="4" cy="12" r=".5" />
        <circle cx="4" cy="18" r=".5" />
      </symbol>
      <symbol id="password" viewBox="0 0 24 24">
        <path
          d="M3 20h18M5 8v6m-3-3h6m-5-2 4 4m0-4-4 4M12 8v6m-3-3h6m-5-2 4 4m0-4-4 4M19 8v6m-3-3h6m-5-2 4 4m0-4-4 4" />
      </symbol>
    </defs>
  </svg>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="ÁgilCert — início"><svg viewBox="0 0 40 40" aria-hidden="true">
          <path fill="#147cc0" d="M20 1 0 38h14Z" />
          <path fill="#075ba1" d="m20 1 10 19-10 8Z" />
          <path fill="#20bdc5" d="m30 20 10 18H26l-6-10Z" />
          <path fill="#00a4b3" d="m10 20 10 8-6 10H0Z" />
          <path fill="#80d5d6" d="m20 28 6 10H14Z" />
        </svg>ÁgilCert</a>
      <nav class="nav" aria-label="Navegação principal"><a href="#inicio">INÍCIO</a><a href="#jornada">ESTUDOS</a><a
          href="#certificacoes" data-modal="certificacoes">CERTIFICAÇÃO</a><a href="#historico"
          data-modal="historico">HISTÓRICO</a><a href="#sobre" data-modal="sobre">SOBRE NÓS</a></nav>
      <div class="account"><a class="account-icon" href="#informacoes" aria-label="Minha conta"><svg fill="none"
            stroke="currentColor" stroke-width="2.4">
            <use href="#user" />
          </svg></a>
        <div class="account-links"><a href="#informacoes">Conta</a><button type="button"
            id="logout-button">Logout</button></div>
      </div>
    </header>
    <main class="content" id="inicio">
      <div class="profile-grid">
        <!-- Painel de Perfil (Lado Esquerdo) -->
        <section class="profile panel" aria-labelledby="profile-name">
          <div class="portrait" style="display:grid;place-items:center;font-size:64px" id="profile-avatar" aria-label="Iniciais do usuário">—</div>
          
          <h1 id="profile-name" style="margin-bottom: 8px;">Minha conta</h1>
          <!-- NOVO: Exibição do E-mail abaixo do nome -->
          <p id="profile-display-email" style="color: #687586; margin-top: 0; margin-bottom: 24px; word-break: break-all;">email@exemplo.com</p>
        
          <button class="primary" type="button" data-modal="certificacoes">Minhas certificações</button>
        </section>
        <section class="details panel" id="informacoes" aria-labelledby="details-title">
          <h2 id="details-title">Informações pessoais</h2>
          <p id="profile-status" role="status"></p>
          <form id="profile-form">
            <dl class="fields">
              <div class="field"><svg class="icon" fill="none" stroke="currentColor" stroke-width="2.3"
                  aria-hidden="true">
                  <use href="#user" />
                </svg>
                <div>
                  <dt>Nome</dt>
                  <dd><input id="profile-fullname" aria-label="Nome" required maxlength="50" autocomplete="name"></dd>
                </div>
              </div>
              <div class="field"><svg class="icon" fill="none" stroke="currentColor" stroke-width="2"
                  aria-hidden="true">
                  <use href="#email" />
                </svg>
                <div>
                  <dt>Email</dt>
                  <dd><input id="profile-email" aria-label="Email" type="email" required maxlength="254"
                      autocomplete="email"></dd>
                </div>
              </div>
              <div class="field"><svg class="icon" fill="none" stroke="currentColor" stroke-width="2"
                  aria-hidden="true">
                  <use href="#list" />
                </svg>
                <div>
                  <dt>CPF</dt>
                  <dd id="profile-cpf">—</dd>
                </div>
              </div>
              <div class="field"><svg class="icon" fill="none" stroke="currentColor" stroke-width="1.5"
                  aria-hidden="true">
                  <use href="#password" />
                </svg>
                <div>
                  <dt>Senha</dt>
                  <dd aria-label="Senha protegida">**********</dd>
                </div>
              </div>
            </dl><button class="primary" id="save-profile" disabled style="margin-top:24px">Salvar alterações</button>
          </form>

        
<details style="margin-top:24px">
  <summary>Alterar senha</summary>
  <form id="password-form">
    <p>
      <label>Senha atual
        <div style="position: relative; display: flex; align-items: center; margin-top: 6px;">
          <input id="current-password" type="password" required autocomplete="current-password" style="padding-right: 40px; width: 100%;">
          <button type="button" onclick="window.toggleSenha('current-password', this)" style="position: absolute; right: 8px; background: none; border: none; padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;" aria-label="Mostrar/Ocultar senha">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#536169" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </label>
    </p>

    <p>
      <label>Nova senha
        <div style="position: relative; display: flex; align-items: center; margin-top: 6px;">
          <input id="new-password" type="password" minlength="8" required autocomplete="new-password" style="padding-right: 40px; width: 100%;">
          <button type="button" onclick="window.toggleSenha('new-password', this)" style="position: absolute; right: 8px; background: none; border: none; padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;" aria-label="Mostrar/Ocultar senha">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#536169" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </label>
    </p>

    <p>
      <label>Confirmar nova senha
        <div style="position: relative; display: flex; align-items: center; margin-top: 6px;">
          <input id="confirm-password" type="password" minlength="8" required autocomplete="new-password" style="padding-right: 40px; width: 100%;">
          <button type="button" onclick="window.toggleSenha('confirm-password', this)" style="position: absolute; right: 8px; background: none; border: none; padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;" aria-label="Mostrar/Ocultar senha">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#536169" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </label>
    </p>

    <p id="password-status" role="status"></p>
    <button class="primary" id="save-password" disabled>Alterar senha</button>
  </form>
</details>

        </section>
      </div>
      <section class="journey panel" id="jornada" aria-labelledby="journey-title">
        <h2 id="journey-title">Processo da jornada</h2>
        <p>Progresso ainda não disponibilizado pelo serviço.</p>
        <div class="progress-wrap">
          <div class="track" role="progressbar" aria-label="Progresso da jornada" aria-valuemin="0" aria-valuemax="100"
            aria-valuetext="Progresso não disponível">
            <div class="fill" style="width:0"></div>
          </div>
          <div class="milestones"><span>Estudos Iniciados</span><span>Simulado Concluído</span><span>Certificação
              Ágil</span></div>
        </div>
      </section>
    </main>
  </div>
  <dialog id="info-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <p id="dialog-text"></p>
    <form method="dialog"><button class="primary">Fechar</button></form>
  </dialog>
  <script>
    const messages = { certificacoes: ['Minhas certificações', 'Nenhuma certificação foi vinculada a esta página demonstrativa.'], historico: ['Histórico', 'O histórico será exibido após a integração com os dados da sua conta.'], sobre: ['Sobre a ÁgilCert', 'Uma jornada de estudos e certificação ágil.'], logout: ['Sair da conta', 'Esta é uma página demonstrativa, sem sessão de login ativa.'] };
    document.querySelectorAll('[data-modal]:not([data-modal="certificacoes"])').forEach(button => button.addEventListener('click', event => { event.preventDefault(); const [title, text] = messages[button.dataset.modal]; document.getElementById('dialog-title').textContent = title; document.getElementById('dialog-text').textContent = text; document.getElementById('info-dialog').showModal(); }));
  </script>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/perfil.js"></script>

</body>

</html>
