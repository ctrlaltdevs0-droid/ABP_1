# Ambiente completo local, independente do Supabase remoto.
# node scripts/preparar-compose.mjs
# docker compose --env-file .env.compose up --build -d
services:
  database:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: abp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute node scripts/preparar-compose.mjs}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?Execute node scripts/preparar-compose.mjs}
    volumes:
      - local_data:/var/lib/postgresql/data
      - ./infra/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d abp']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: postgres:17.11-bookworm
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGDATABASE: abp
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Execute node scripts/preparar-compose.mjs}
    entrypoint: [/bin/sh, /infra/migrate.sh]
    volumes:
      - ./infra/migrate.sh:/infra/migrate.sh:ro
      - ./backend/database:/base:ro
      - ./supabase/migrations:/migrations:ro
    restart: 'no'

  rest:
    image: postgrest/postgrest:v13.0.7
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_AUTH_PASSWORD:?Execute node scripts/preparar-compose.mjs}@database:5432/abp
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Execute node scripts/preparar-compose.mjs}
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    depends_on: [rest]
    volumes:
      - ./infra/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/rest/v1/']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      SUPABASE_URL: http://gateway:8080
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Execute node scripts/preparar-compose.mjs}
      JWT_SECRET: ${JWT_SECRET:?Execute node scripts/preparar-compose.mjs}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/teste-supabase').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  local_data:
