
services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile

    container_name: abp_backend
    init: true

    env_file:
      - ./.env

    environment:
      NODE_ENV: production
      PORT: "3000"

    ports:
      - "3000:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

  database:
    image: supabase/postgres:17.6.1.136
    container_name: abp_supabase_db

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}

    command: postgres -c config_file=/etc/postgresql/postgresql.conf

    volumes:
      - postgres_data:/var/lib/postgresql/data

      # Criação das tabelas
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

      # Inserção dos dados iniciais
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres_data:
